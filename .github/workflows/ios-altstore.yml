name: Build AltStore IPA

on:
  push:
    branches: [ios-altstore]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared data and native project
        run: |
          pnpm run mobile:typecheck
          pnpm run test:mobile
          pnpm run native:check
          pnpm run test:native-config
      - name: Test native app on ordinary iPhone and Duo simulators
        run: pnpm run ios:test --require-duo
      - name: Build native SwiftUI IPA
        run: pnpm run ios:ipa
      - name: Upload native screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_Menu-native-tests
          path: |
            build/ios/screenshots/
            build/ios/tests/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: A_Menu-altstore
          path: dist/A_Menu-altstore.ipa
          if-no-files-found: error
          retention-days: 14
